# Uploads a finished release zip to Nexus Mods as a new version of the existing file.
#
# The game's DLLs are not on GitHub, so CI cannot build the mod. Build it on your machine, then:
#   1. Create a GitHub release whose tag is the version (1.0.2 or v1.0.2).
#   2. Attach CollegeEducatedSpouts-<version>.zip to it. Put the changelog in the release notes.
#   3. Publishing the release runs this workflow. It can also be run by hand from the Actions tab with a tag.
#
# One-time setup in the repo's Settings > Secrets and variables > Actions:
#   Secret    NEXUSMODS_API_KEY   your personal Nexus API key
#   Variable  NEXUSMODS_FILE_ID   7847, the File ID of any version already in the Main file's update chain
#   Variable  NEXUSMODS_MOD_ID    1940, the number in the mod page URL
# Both are the game-scoped numbers the website shows. The upload action talks to the v3 API, which wants
# global IDs instead, so the "Resolve Nexus v3 IDs" step looks those up before uploading.
name: Upload to Nexus Mods

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload (for example 1.0.2)'
        required: true

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
    steps:
      - name: Get the release zip and notes
        id: rel
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "CollegeEducatedSpouts-*.zip" --dir .
          ZIP="$(ls CollegeEducatedSpouts-*.zip | head -n 1)"
          case "$ZIP" in
            "CollegeEducatedSpouts-$VERSION.zip") ;;
            *) echo "Attached zip '$ZIP' does not match tag '$TAG'"; exit 1 ;;
          esac
          NOTES="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          {
            echo "version=$VERSION"
            echo "zip=$ZIP"
            echo "notes<<NOTES_EOF"
            echo "$NOTES"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve Nexus v3 IDs
        id: ids
        env:
          NEXUS_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          FILE_VERSION_ID: ${{ vars.NEXUSMODS_FILE_ID }}
          MOD_SCOPED_ID: ${{ vars.NEXUSMODS_MOD_ID }}
        run: |
          set -euo pipefail
          api() { curl -fsS -H "apikey: $NEXUS_KEY" -H "User-Agent: CollegeEducatedSpouts-ci" "https://api.nexusmods.com/v3/$1"; }
          FILE_ID="$(api "games/railroader/mod-file-versions/$FILE_VERSION_ID" | jq -er '.data.file.id // .file.id')"
          MOD_ID="$(api "games/railroader/mods/$MOD_SCOPED_ID" | jq -er '.data.id // .id')"
          echo "Mod file version $FILE_VERSION_ID belongs to v3 mod file $FILE_ID; mod $MOD_SCOPED_ID is v3 mod $MOD_ID"
          echo "file_id=$FILE_ID" >> "$GITHUB_OUTPUT"
          echo "mod_id=$MOD_ID" >> "$GITHUB_OUTPUT"

      - name: Upload to Nexus Mods
        uses: Nexus-Mods/upload-action@main
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ steps.ids.outputs.file_id }}
          mod_id: ${{ steps.ids.outputs.mod_id }}
          filename: ${{ steps.rel.outputs.zip }}
          display_name: College-Educated Spouts ${{ steps.rel.outputs.version }}
          version: ${{ steps.rel.outputs.version }}
          category: main
          changelog: ${{ steps.rel.outputs.notes }}
          update_mod_version: true
